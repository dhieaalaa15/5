<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اختبار العلوم التفاعلي - أبطال العلوم</title>
  <link rel="icon" type="image/png" href="https://img.icons8.com/emoji/96/test-tube-emoji.png">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f3f4f6;
      --card-bg: #ffffff;
      --text: #1f2937;
      --success: #10b981;
      --error: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 600px;
      padding: 30px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    h1 {
      color: var(--primary);
      margin-bottom: 15px;
      font-size: 2rem;
    }

    p {
      color: #4b5563;
      margin-bottom: 25px;
      font-size: 1.1rem;
      line-height: 1.6;
    }

    .btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px 28px;
      font-size: 1.1rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: bold;
    }

    .btn:hover {
      background-color: var(--primary-hover);
      transform: translateY(-2px);
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-top: 20px;
    }

    .option-btn {
      background-color: #f9fafb;
      border: 2px solid #e5e7eb;
      color: var(--text);
      padding: 14px;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      text-align: right;
      transition: all 0.2s;
    }

    .option-btn:hover {
      border-color: var(--primary);
      background-color: #eeefef;
    }

    .option-btn.correct {
      background-color: #d1fae5;
      border-color: var(--success);
      color: #065f46;
    }

    .option-btn.wrong {
      background-color: #fee2e2;
      border-color: var(--error);
      color: #991b1b;
      animation: shake 0.4s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

    .rights {
      margin-top: 25px;
      padding-top: 15px;
      border-top: 1px solid #e5e7eb;
      font-size: 0.9rem;
      color: #6b7280;
    }

    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="container">
    <!-- شاشة الترحب -->
    <div id="welcome-screen">
      <h1>🧪 أبطال العلوم 🧪</h1>
      <p>أهلاً بكم في اختبار العلوم التفاعلي للصف السادس الابتدائي (الفصل الأول والثاني)!<br>هل أنت جاهز لتحدي الـ 20 سؤالاً؟</p>
      <button class="btn" onclick="startQuiz()">ابدأ الاختبار الآن</button>
    </div>

    <!-- شاشة الاختبار -->
    <div id="quiz-screen" class="hidden">
      <h2 id="question-text" style="margin-bottom: 20px;">الأسئلة ستظهر هنا...</h2>
      <div id="options-container" class="options-grid"></div>
    </div>

    <!-- شاشة النتيجة -->
    <div id="result-screen" class="hidden">
      <h1>🎉 النتيجة النهائية 🎉</h1>
      <p id="score-text"></p>
      <button class="btn" onclick="restartQuiz()">إعادة الاختبار</button>
    </div>

    <!-- الحقوق -->
    <div class="rights">
      برمجة وتطوير: <strong>المبرمج ضياء</strong> | إعداد المعلم: <strong>إيهاب أمجد عبدالحميد</strong>
    </div>
  </div>

  <script>
    const questions = [
      { q: "ما هو العضو المسؤول عن التذوق؟", options: ["الأنف", "اللسان", "الأذن", "العين"], answer: 1 },
      { q: "ما هي الوحدة الأساسية لبناء جسم الكائن الحي؟", options: ["الخلية", "النسيج", "العضو", "الجهاز"], answer: 0 },
      { q: "أي مما يلي يعد من المخاليط المتجانسة؟", options: ["الماء والزيت", "السكر والماء", "الرمل والماء", "الحصى والماء"], answer: 1 },
      { q: "ما العملية التي يتحول فيها الماء من السائل إلى الغاز؟", options: ["التكثف", "الانصهار", "التبخر", "التجمد"], answer: 2 },
      { q: "ما هي قوة الجذب التي تطبقها الأرض على الأجسام؟", options: ["الاحتكاك", "الجاذبية", "المغناطيسية", "الكهربائية"], answer: 1 },
      { q: "العضو المسؤول عن ضخ الدم في الجسم هو:", options: ["الرئة", "المعدة", "القلب", "الكبد"], answer: 2 },
      { q: "ما المادة التي تشكل نسبة أكبر من الهواء الجوي؟", options: ["الأكسجين", "النيتروجين", "ثاني أكسيد الكربون", "الهيدروجين"], answer: 1 },
      { q: "أي من العناصر التالية يعتبر موصلاً جيداً للكهرباء؟", options: ["الخشب", "النحاس", "البلاستيك", "الزجاج"], answer: 1 },
      { q: "ما مصدر الطاقة الرئيسي على سطح الأرض؟", options: ["الرياح", "الشمس", "النفط", "الكهرباء"], answer: 1 },
      { q: "العملية التي يصنع بها النبات غذاءه تسمى:", options: ["التنفس", "البناء الضوئي", "الامتصاص", "الهضم"], answer: 1 },
      { q: "ما هو الغاز الذي ينقله الدم من الرئتين إلى باقي الجسم؟", options: ["الأكسجين", "النيتروجين", "ثاني أكسيد الكربون", "الهيليوم"], answer: 0 },
      { q: "أي جزء من النبات يمتص الماء والأملاح من التربة؟", options: ["الساق", "الأوراق", "الجذور", "الأزهار"], answer: 2 },
      { q: "حالة المادة التي لها شكل وحجم ثابتين هي الحالة:", options: ["الصلبة", "السائلة", "الغازية", "اللازما"], answer: 0 },
      { q: "ما هو العضو المسؤول عن عملية الهضم الأساسية للامتصاص؟", options: ["المعدة", "الأمعاء الدقيقة", "المرئ", "الفم"], answer: 1 },
      { q: "جهاز يستخدم لقياس درجة الحرارة هو:", options: ["الميزان", "المسطرة", "الترمومتر", "البارومتر"], answer: 2 },
      { q: "تسمى المادة التي لا تسمح بمرور الضوء من خلالها مادة:", options: ["شفافة", "شبه شفافة", "معتمة", "مرنة"], answer: 2 },
      { q: "أي الجسيمات التالية توجد داخل نوات الذرة؟", options: ["البروتونات والنيوترونات", "الالكترونات فقط", "الالكترونات والبروتونات", "النيوترونات فقط"], answer: 0 },
      { q: "تسمى تحول المادة من الحالة الصلبة إلى السائلة مباشرة بـ:", options: ["التجمد", "الانصهار", "التكثف", "السامي"], answer: 1 },
      { q: "العضو الذي يحمي المخ هو:", options: ["القفص الصدري", "الجمجمة", "العمود الفقري", "الحوض"], answer: 1 },
      { q: "ما الجهاز المسؤول عن الحركة في جسم الإنسان؟", options: ["الجهاز الهيكلي والعضلي", "الجهاز الدوري", "الجهاز التنفسي", "الجهاز العصبي"], answer: 0 }
    ];

    let currentQ = 0;
    let score = 0;

    function startQuiz() {
      document.getElementById('welcome-screen').classList.add('hidden');
      document.getElementById('quiz-screen').classList.remove('hidden');
      showQuestion();
    }

    function showQuestion() {
      const q = questions[currentQ];
      document.getElementById('question-text').innerText = `السؤال ${currentQ + 1}: ${q.q}`;
      const container = document.getElementById('options-container');
      container.innerHTML = '';

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(idx, btn);
        container.appendChild(btn);
      });
    }

    function checkAnswer(selected, btn) {
      const q = questions[currentQ];
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(b => b.disabled = true);

      if (selected === q.answer) {
        btn.classList.add('correct');
        score++;
      } else {
        btn.classList.add('wrong');
        buttons[q.answer].classList.add('correct');
      }

      setTimeout(() => {
        currentQ++;
        if (currentQ < questions.length) {
          showQuestion();
        } else {
          showResults();
        }
      }, 1200);
    }

    function showResults() {
      document.getElementById('quiz-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.remove('hidden');
      document.getElementById('score-text').innerText = `لقد حصلت على ${score} من 20!`;
    }

    function restartQuiz() {
      currentQ = 0;
      score = 0;
      document.getElementById('result-screen').classList.add('hidden');
      document.getElementById('welcome-screen').classList.remove('hidden');
    }
  </script>
</body>
</html>
